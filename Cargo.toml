[package]
name = "eso_common"
version = "0.1.0"
edition = "2021"

[features]
default = ["native"]
native = ["dep:libloading"]

[dependencies]
serde = { version = "1", features = ["derive"] }
flate2 = "1"
snap = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libloading = { version = "0.8", optional = true }